name: Bootstrap E2E

# Proves `npm run dev:full` end to end on a fresh runner with no Docker and
# no Cloudflare account: deps install → D1 migrations applied to the local
# state → wrangler dev → the ✅ Full stack banner — then `npm run dev:down`
# proves the teardown and lets the bootstrap exit 0. This is the only job
# that exercises the actual bootstrap script (scripts/dev-bootstrap.mjs).
#
# Manual runs (workflow_dispatch) default to the FULL proof: the `run_smoke`
# input enables the bootstrap's RUN_SMOKE=1 gate, which runs the photo →
# confirm → undo round trip against the D1 stores right after the migration
# apply — and aborts the whole bootstrap if it fails — so one run proves
# dev:full + the round trip + the teardown together. Push/tag runs leave it
# off (inputs is empty there; the separate smoke job in ci.yml already covers
# every push).
on:
  workflow_dispatch:
    inputs:
      run_smoke:
        description: "Also run the photo → confirm → undo smoke inside this job (RUN_SMOKE=1)"
        type: boolean
        default: true
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  bootstrap:
    name: dev:full → banner → dev:down
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Dispatch input → the bootstrap's RUN_SMOKE=1 gate. Evaluates to '' on
      # push/tag runs (no inputs), '1' on manual runs unless unchecked.
      RUN_SMOKE: ${{ inputs.run_smoke == true && '1' || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The bootstrap never exits on its own — it blocks on the wrangler dev
      # child — so run it in the background and drive it: wait for the banner
      # in its log, assert the endpoints, then `dev:down` to stop the stack
      # (which also makes the bootstrap exit 0). No retries needed: there is
      # no image pull to hit Docker rate limits anymore.
      - name: Run dev:full end to end
        env:
          RUN_SMOKE: ${{ env.RUN_SMOKE }}
        run: |
          set -euo pipefail
          echo "RUN_SMOKE variant: ${RUN_SMOKE:-off}"
          DEV_PORT=8795 npm run dev:full > full.log 2>&1 &
          BOOT_PID=$!
          found=""
          for i in $(seq 1 90); do
            if grep -q "Full stack is up" full.log 2>/dev/null; then found=1; break; fi
            if ! kill -0 "$BOOT_PID" 2>/dev/null; then break; fi
            sleep 5
          done
          if [ -z "$found" ]; then
            echo "::error::dev:full did not reach the banner — full log follows"
            cat full.log
            exit 1
          fi

          echo "=== ✅ Full stack banner ==="
          grep -A9 "Full stack is up" full.log | head -10

          echo "=== asserting endpoints ==="
          curl -sf http://127.0.0.1:8795/health >/dev/null && echo "PASS: /health"
          curl -sf http://127.0.0.1:8795/dev/demo >/dev/null && echo "PASS: /dev/demo"
          curl -sf http://127.0.0.1:8795/dev/dashboard >/dev/null && echo "PASS: /dev/dashboard"
          curl -sf http://127.0.0.1:8795/app >/dev/null && echo "PASS: /app"

          # RUN_SMOKE variant: the bootstrap's gate ran the round trip before
          # wrangler (and would have aborted the bootstrap on failure), so by
          # the banner the smoke must have passed — assert its summary line.
          if [ "$RUN_SMOKE" = "1" ]; then
            if grep -q "Smoke test passed" full.log; then
              echo "PASS: photo → confirm → undo smoke ran and passed inside dev:full"
            else
              echo "::error::RUN_SMOKE gate did not report a pass — see full.log"
              exit 1
            fi
          fi

          echo "=== teardown: dev:down ==="
          DEV_PORT=8795 npm run dev:down
          set +e
          wait "$BOOT_PID"
          BOOT_EXIT=$?
          set -e
          echo "bootstrap exit: $BOOT_EXIT"
          test "$BOOT_EXIT" = "0"

          {
            echo "### Bootstrap E2E ✅"
            echo ""
            grep -A9 "Full stack is up" full.log | head -10
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload bootstrap log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-e2e-log
          path: full.log
          if-no-files-found: ignore
