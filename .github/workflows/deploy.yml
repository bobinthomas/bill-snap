name: Deploy

on:
  push:
    branches: [main]
    tags: ["v*"]

# One deploy at a time; a newer push/tag supersedes an in-flight one. Both
# events can fire for the same commit (push to main + release tag), and both
# deploy identical content, so the newest run winning is always correct.
concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  # Gate: the exact same typecheck + tests + §5.7 eval as CI. Nothing ships
  # unless every criterion passes.
  check:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to Cloudflare Workers
    needs: check
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Worker secrets live in Cloudflare, not wrangler.toml. Values come from
      # GitHub Actions secrets; a missing secret fails the job before anything
      # ships without it. Passed via env (never inlined) so shell interpolation
      # can't mangle tokens.
      - name: Set worker secrets
        env:
          WHATSAPP_VERIFY_TOKEN: ${{ secrets.WHATSAPP_VERIFY_TOKEN }}
          WHATSAPP_APP_SECRET: ${{ secrets.WHATSAPP_APP_SECRET }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          echo "$WHATSAPP_VERIFY_TOKEN" | npx wrangler secret put WHATSAPP_VERIFY_TOKEN
          echo "$WHATSAPP_APP_SECRET" | npx wrangler secret put WHATSAPP_APP_SECRET
          echo "$WHATSAPP_PHONE_NUMBER_ID" | npx wrangler secret put WHATSAPP_PHONE_NUMBER_ID
          echo "$WHATSAPP_TOKEN" | npx wrangler secret put WHATSAPP_TOKEN
          echo "$SUPABASE_URL" | npx wrangler secret put SUPABASE_URL
          echo "$SUPABASE_SERVICE_ROLE_KEY" | npx wrangler secret put SUPABASE_SERVICE_ROLE_KEY

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
