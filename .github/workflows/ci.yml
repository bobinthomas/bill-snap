name: CI

on:
  push:
  pull_request:
  # Reusable from the deploy workflow: the same gates run before shipping.
  workflow_call:

jobs:
  check:
    name: typecheck + tests + eval
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      # §5.7 regression gate: replay the committed golden corpus through the
      # real pipeline. Committed synthetic images (eval/corpus/synthetic/) are
      # OCR-scored in Node; only mirror-only labels (eval/corpus/images/,
      # gitignored) are skipped. A regression fails the run.
      - name: Eval harness (§5.7)
        run: npm run eval

      - name: Upload eval baseline report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval/reports/latest.json
          if-no-files-found: ignore

  # Real-stores smoke (photo → confirm → undo) against a freshly booted local
  # Supabase. This is the one gate that exercises the actual migrations
  # (supabase/migrations/) + seed (supabase/seed.sql) and the REST/Storage
  # stores, so a schema or store regression fails CI — and, via workflow_call,
  # blocks deploys. Uses the committed pinned supabase/config.toml.
  #
  # The CLI is invoked exactly like scripts/dev-bootstrap.mjs does locally
  # (`npx -y supabase …`), but pinned to the version whose defaults the
  # committed config.toml captures, and cached by the setup-node npm cache.
  smoke:
    name: Supabase smoke (photo → confirm → undo)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Optional: authenticating to Docker Hub raises the anonymous pull limit
      # (100/6h per shared runner IP) and avoids `toomanyrequests` flakes when
      # jobs pull the Supabase images in parallel. Set DOCKERHUB_USERNAME /
      # DOCKERHUB_TOKEN repo secrets to enable. (Secrets can't be referenced
      # in `if:`, so they are copied into env vars and tested there.)
      - name: Log in to Docker Hub
        if: ${{ env.DH_USER != '' && env.DH_TOKEN != '' }}
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # First boot pulls the Postgres/Storage/Auth images (~2-4 min), then
      # applies migrations + seed automatically. Retry the pull-heavy start up
      # to 3 times: fresh runners share egress IPs, so anonymous pulls can hit
      # Docker rate limits; pulled layers persist between attempts.
      - name: Start local Supabase
        run: |
          for attempt in 1 2 3; do
            echo "attempt $attempt: supabase start"
            if npx -y supabase@2.114.0 start; then exit 0; fi
            echo "supabase start failed (attempt $attempt)"
            sleep 20
          done
          exit 1

      # Re-apply from a known state so the smoke always runs against the exact
      # committed schema + seed, matching the local `dev:full` recipe.
      - name: Apply migrations + seed
        run: npx -y supabase@2.114.0 db reset

      # `supabase status -o env` prints KEY=value lines — valid dotenv, so it
      # IS the .env.smoke the smoke test reads (SUPABASE_URL + service key).
      - name: Write .env.smoke from the running stack
        run: npx -y supabase@2.114.0 status -o env > .env.smoke

      - name: Smoke (photo → confirm → undo against real stores)
        run: npm run smoke
