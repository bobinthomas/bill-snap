name: CI

on:
  push:
  pull_request:
  # Reusable from the deploy workflow: the same gates run before shipping.
  workflow_call:

jobs:
  check:
    name: typecheck + tests + eval
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      # §5.7 regression gate: replay the committed golden corpus through the
      # real pipeline. Committed synthetic images (eval/corpus/synthetic/) are
      # OCR-scored in Node; only mirror-only labels (eval/corpus/images/,
      # gitignored) are skipped. A regression fails the run.
      - name: Eval harness (§5.7)
        run: npm run eval

      - name: Upload eval baseline report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval/reports/latest.json
          if-no-files-found: ignore

  # Real-stores smoke (photo → confirm → undo) through the production store
  # implementations — the D1 stores over a node:sqlite shim running the real
  # migrations/0001_schema.sql, and the R2 storage over a fake bucket. This is
  # the one gate that exercises the actual webhook router end to end against
  # real SQL semantics (foreign keys, partial-index idempotency, RETURNING),
  # so a store or schema regression fails CI — and, via workflow_call, blocks
  # deploys. No Docker, no Cloudflare account, no secrets: it always runs.
  smoke:
    name: D1 smoke (photo → confirm → undo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Smoke (photo → confirm → undo against D1 stores)
        run: npm run smoke
