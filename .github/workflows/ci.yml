name: CI

on:
  push:
  pull_request:
  # Reusable from the deploy workflow: the same gates run before shipping.
  workflow_call:

jobs:
  check:
    name: typecheck + tests + eval
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      # §5.7 regression gate: replay the committed golden corpus through the
      # real pipeline. Committed synthetic images (eval/corpus/synthetic/) are
      # OCR-scored in Node; only mirror-only labels (eval/corpus/images/,
      # gitignored) are skipped. A regression fails the run.
      - name: Eval harness (§5.7)
        run: npm run eval

      - name: Upload eval baseline report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval/reports/latest.json
          if-no-files-found: ignore
