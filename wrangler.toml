# BillSnap Worker config (SCAFFOLDING_PLAN.md §5) — LOCAL DEV config.
name = "bill-snap"
main = "src/index.ts"
compatibility_date = "2026-08-01"

# NOTE: the Workers AI binding is deliberately NOT here. It is remote-only:
# `wrangler dev` opens a remote proxy session for it, which requires a
# Cloudflare login — so a fresh clone (or CI runner) without credentials
# would hang before the server starts. Dev keeps the regex-first pipeline
# with the GEMINI_MOCK=true canned readings; the real env.AI binding lives in
# wrangler.deploy.toml and is applied by `npm run deploy` (see §5.3).

# D1 database — the data model (users/businesses/memberships/transactions) (§5.5).
# Local dev uses miniflare's local SQLite state (no Cloudflare account, no
# Docker): `wrangler d1 migrations apply bill-snap --local` applies
# migrations/0001_schema.sql. The database_id below is a placeholder — only
# remote deploys use it; wrangler.deploy.toml carries the real id from
# `wrangler d1 create bill-snap`.
[[d1_databases]]
binding = "DB"
database_name = "bill-snap"
database_id = "6768f8b1-14da-4ff5-8fd0-abc1572cea3b"

# R2 bucket — bill images (§5.5). Local dev writes to miniflare's local state
# (the bucket is created implicitly); it must exist remotely before deploy:
# `wrangler r2 bucket create bill-snap-bills`.
[[r2_buckets]]
binding = "BILLS"
bucket_name = "bill-snap-bills"

# Cron for the nudge/expiry sweep (§5.6/§6.2). Dev: `wrangler dev --test-scheduled`
# fires the scheduled handler when the dev URL is hit.
[triggers]
crons = ["*/2 * * * *"]
