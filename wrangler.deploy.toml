# BillSnap Worker config — PRODUCTION DEPLOY ONLY (`wrangler deploy -c wrangler.deploy.toml`).
#
# Same as wrangler.toml plus the Workers AI binding (§5.3 fallback parser,
# available natively as env.AI — no API key, no external HTTP calls). The
# binding is kept out of wrangler.toml because it is remote-only: `wrangler
# dev` opens a remote proxy session for it that requires a Cloudflare login,
# which would block fresh clones and CI runners. Keep this file in sync with
# wrangler.toml (name/main/compatibility_date/triggers).
#
# First deploy (one-time, from a logged-in machine):
#   wrangler d1 create bill-snap        → paste the returned id as database_id below
#   wrangler r2 bucket create bill-snap-bills
#   wrangler d1 migrations apply bill-snap --remote
name = "bill-snap"
main = "src/index.ts"
compatibility_date = "2026-08-01"

[observability]
enabled = true

[ai]
binding = "AI"

# D1 database — the data model (§5.5). database_id comes from
# `wrangler d1 create bill-snap` (the worker is named after the database).
[[d1_databases]]
binding = "DB"
database_name = "bill-snap"
database_id = "6768f8b1-14da-4ff5-8fd0-abc1572cea3b"

# R2 bucket — bill images (§5.5).
[[r2_buckets]]
binding = "BILLS"
bucket_name = "bill-snap-bills"

[triggers]
crons = ["*/2 * * * *"]
